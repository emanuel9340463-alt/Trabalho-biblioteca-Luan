<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa</title>
</head>
<body>
    <div class="container">
        <h1>Pesquisa de Livros</h1>

            <div class="mb-3">

        </form>
    </div>
</body>
</html>
